services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    container_name: recall_postgres
    env_file:
      - ./.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recall_backend
    env_file:
      - ./.env.prod
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recall_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
