name: recall-dev

services:
  db_dev:
    image: postgres:17
    container_name: recall_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: recall_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  db_test:
    image: postgres:17
    container_name: recall_db_test
    environment:
      POSTGRES_DB: recall_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"

volumes:
  postgres_dev_data:
